
name: Build CEV-MTik-Manager Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android source
        run: unzip -o CEV-MTik-Manager-Android-V1-Source.zip -d .

      - name: Remove duplicate Groovy Gradle files
        run: |
          cd CEV-MTik-Manager-Android-V1
          rm -f build.gradle
          rm -f app/build.gradle
          rm -f settings.gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools,platforms;android-35,build-tools;35.0.0

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: -p CEV-MTik-Manager-Android-V1 assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CEV-MTik-Manager-Android-debug
          path: CEV-MTik-Manager-Android-V1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
